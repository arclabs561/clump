name: ci

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  basics:
    name: basics (fmt + clippy + check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: check
        run: cargo check --all-targets --features parallel,simd,serde,ndarray,blas

  test:
    runs-on: ubuntu-latest
    needs: basics
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-nextest
      - name: nextest
        run: cargo nextest run --features parallel,simd,serde,ndarray,blas
      - name: doc tests
        run: cargo test --doc --features parallel,simd,serde,ndarray,blas
      - name: run example assertions
        run: |
          cargo run --example flat_input
          cargo run --example streaming

  semver:
    name: Semver check
    runs-on: ubuntu-latest
    needs: basics
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          # Rust 1.99 emits rustdoc v61, supported by this checker version.
          tool: cargo-semver-checks@0.51.0
      - run: cargo semver-checks

  test-macos:
    runs-on: macos-latest
    needs: basics
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-nextest
      - name: nextest (all features incl. GPU)
        run: cargo nextest run --all-features
      - name: doc tests
        run: cargo test --doc --all-features

  feature-matrix:
    runs-on: ubuntu-latest
    needs: basics
    strategy:
      fail-fast: false
      matrix:
        feature: [parallel, simd, serde, ndarray, blas]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.feature }}
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-nextest
      - name: nextest --features ${{ matrix.feature }}
        run: cargo nextest run --features ${{ matrix.feature }}

  msrv:
    runs-on: ubuntu-latest
    needs: basics
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: check (MSRV 1.89, all supported Linux features)
        run: rm -f Cargo.lock && cargo check --all-targets --features parallel,simd,serde,ndarray,blas

  bench:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: basics
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: run benchmarks
        run: cargo bench --bench clustering -- --output-format bencher | tee bench-output.txt
      - name: store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: cargo
          output-file-path: bench-output.txt
          alert-threshold: "120%"
          fail-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true

  compare-closing-fits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - name: Compare Word2Vec fits on this runner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cargo build --release --features simd --example emeans_word2vec
          cp target/release/examples/emeans_word2vec /tmp/candidate
          git show "$BASE_SHA:src/cluster/emeans.rs" > src/cluster/emeans.rs
          cargo build --release --features simd --example emeans_word2vec
          cp target/release/examples/emeans_word2vec /tmp/baseline
          python3 - <<'PY'
          import sys, random, statistics
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from bench_emeans_word2vec import load_data, fit
          data = Path("target/word2vec-10k.f32")
          load_data(data)
          bins = {"baseline": "/tmp/baseline", "candidate": "/tmp/candidate"}
          for binary in bins.values():
              fit(binary, data, "emeans", 1, 99)
          rng = random.Random(4123)
          for budget in (1, 4, 8):
              elapsed = {key: [] for key in bins}
              delta = []
              for repeat in range(3):
                  for seed in (7, 13, 23, 37, 53):
                      order = list(bins)
                      rng.shuffle(order)
                      losses = []
                      for key in order:
                          wall, loss = fit(bins[key], data, "emeans", budget, seed)
                          elapsed[key].append(wall)
                          losses.append(loss)
                      delta.append(abs(losses[0] - losses[1]))
              t = {key: statistics.median(v) for key, v in elapsed.items()}
              print(f"WORD2VEC budget={budget} median_seconds={t} ratio={t['candidate']/t['baseline']:.4f} max_loss_change={max(delta)}")
          times = []
          losses = []
          for repeat in range(3):
              for seed in (7, 13, 23, 37, 53):
                  wall, loss = fit("/tmp/candidate", data, "kmeans", 8, seed)
                  times.append(wall)
                  losses.append(loss)
          print(f"LLOYD8 median_seconds={statistics.median(times)} max_loss={max(losses)}")
          PY
          cat >> src/cluster/emeans.rs <<'RS'
          #[test]
          fn baseline_cancelling_mean() {
              let large = 2_f32.powi(80);
              let data = [vec![large], vec![1.0], vec![1.0], vec![-large]];
              for seed in 0..32 {
                  let fit = Emeans::new(1).with_seed(seed).fit(&data).unwrap();
                  assert_eq!(fit.centroids[0], [0.5], "seed {seed}");
              }
          }
          RS
          if cargo test --lib baseline_cancelling_mean > /tmp/baseline-test.log 2>&1; then
              echo "Unexpected baseline pass"
              exit 1
          fi
          grep -A7 'baseline_cancelling_mean stdout' /tmp/baseline-test.log
